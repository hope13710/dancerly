<!-- Supabase → Authentication → Emails → Templates → "Confirm signup". Subject: Your dancerly code: {{ .Token }} -->
<div style="margin:0;padding:32px 16px;background:#f4f5f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#15171b;">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border:1px solid #e7e8ee;border-radius:14px;padding:32px 28px;">
    <img src="https://dancerly.app/logo-wordmark.png" alt="dancerly" height="24" style="display:block;height:24px;width:auto;margin:0 0 28px;" />
