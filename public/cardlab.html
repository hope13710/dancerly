<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Card lab</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 16px; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; background: #f6f6f7; color: #17191c; }
  @media (prefers-color-scheme: dark) { body { background: #14171d; color: #eceef2; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 4px 0 12px; opacity: .75; }
  table { border-collapse: collapse; width: 100%; max-width: 560px; margin-bottom: 16px; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid rgba(127,127,127,.25); vertical-align: top; }
  td:last-child { font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
  button { font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(127,127,127,.4); background: transparent; color: inherit; }
  button.primary { background: #5b5ce2; color: #fff; border-color: #5b5ce2; }
  button:disabled { opacity: .45; }
  #log { font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; max-width: 560px; }
  video, canvas.preview { width: 100%; max-width: 280px; border-radius: 12px; background: #000; display: block; }
</style>
</head>
<body>
<h1>Card lab</h1>
<p>Checks whether this phone can make a short video card, then makes one from the sample takes. Nothing is uploaded.</p>
<table id="caps"></table>
<div class="row">
  <button class="primary" data-make="split">Make “Split” (7 s)</button>
  <button class="primary" data-make="wipe">Make “Wipe” (7 s)</button>
</div>
<div class="row">
  <button data-share disabled>Share…</button>
  <button data-save disabled>Download</button>
</div>
<video data-out playsinline controls loop muted hidden></video>
<pre id="log"></pre>
<script type="module">
const $ = (s) => document.querySelector(s);
const log = (m) => { $('#log').textContent += `${m}\n`; };
const qs = new URLSearchParams(location.search);
const W = Number(qs.get('w') || 1080), H = Math.round(W * 16 / 9);
const FPS = 30, LEN = 7;
const SRC = qs.get('src') ? qs.get('src').split(',') : ['/samples/opener-take-1.mp4', '/samples/opener-take-2.mp4'];
const T0 = Number(qs.get('t0') || 2.0); // the moment both takes start from (the lined-up beat)
const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Apple SD Gothic Neo", sans-serif';

let mb;
let result = null;

async function caps() {
  mb = await import('/app/vendor/mediabunny-card-1.61.3.js');
  const rows = [];
  const yes = (b) => (b ? 'yes' : 'no');
  rows.push(['Browser', navigator.userAgent.replace(/^Mozilla\/5.0 /, '')]);
  rows.push(['WebCodecs encoder', yes(typeof VideoEncoder === 'function')]);
  rows.push(['WebCodecs decoder', yes(typeof VideoDecoder === 'function')]);
  for (const codec of ['avc', 'hevc', 'vp9']) {
    let ok = false;
    try { ok = await mb.canEncodeVideo(codec, { width: W, height: H, bitrate: 6e6 }); } catch {}
    rows.push([`Encode ${codec} ${W}×${H}`, yes(ok)]);
  }
  rows.push(['MediaRecorder mp4', yes(window.MediaRecorder?.isTypeSupported?.('video/mp4'))]);
  let share = false;
  try { share = navigator.canShare?.({ files: [new File([new Uint8Array(8)], 'card.mp4', { type: 'video/mp4' })] }); } catch {}
  rows.push(['Share a video file', yes(share)]);
  $('#caps').innerHTML = rows.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('');
}

// ---------- Drawing ----------
function label(g, text, x, y, { size, weight = 800, bg = null, fg = '#fff', pad = 0.42, align = 'left' }) {
  g.font = `${weight} ${size}px ${FONT}`;
  const w = g.measureText(text).width;
  const px = size * pad, h = size * 1.5;
  const left = align === 'right' ? x - w - px * 2 : x;
  if (bg) { g.fillStyle = bg; g.beginPath(); g.roundRect(left, y, w + px * 2, h, h * 0.28); g.fill(); }
  g.fillStyle = fg; g.textBaseline = 'middle'; g.fillText(text, left + px, y + h / 2 + size * 0.04);
}
function fit(g, img, x, y, w, h, mode = 'cover') {
  if (!img) { g.fillStyle = '#222'; g.fillRect(x, y, w, h); return; }
  const s = mode === 'cover' ? Math.max(w / img.width, h / img.height) : Math.min(w / img.width, h / img.height);
  const iw = img.width * s, ih = img.height * s;
  g.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
}
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const clamp = (t) => Math.max(0, Math.min(1, t));

const CARD = { crew: 'NOVA CREW', title: 'Supernova · Chorus', from: 'DAY 1', to: 'DAY 23', dday: 'SHOWCASE D-7' };

function frameSplit(g, a, b, t) {
  g.fillStyle = '#0d0e12'; g.fillRect(0, 0, W, H);
  const u = W / 1080;
  const ph = Math.round(W * 9 / 16), gap = 16 * u, mid = H / 2;
  const ya = mid - gap / 2 - ph, yb = mid + gap / 2;
  fit(g, a, 0, ya, W, ph); fit(g, b, 0, yb, W, ph);
  g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(0, ya, W, ph); // the past, a touch dimmer
  label(g, CARD.from, 40 * u, ya + 28 * u, { size: 40 * u, bg: 'rgba(0,0,0,0.55)' });
  label(g, CARD.to, 40 * u, yb + 28 * u, { size: 40 * u, bg: '#fff', fg: '#000' });
  // Header and footer in the bands Instagram leaves free.
  g.fillStyle = '#fff'; g.textBaseline = 'alphabetic';
  g.font = `900 ${72 * u}px ${FONT}`; g.fillText(CARD.crew, 56 * u, ya - 92 * u);
  g.globalAlpha = 0.72; g.font = `600 ${36 * u}px ${FONT}`; g.fillText(CARD.title, 58 * u, ya - 40 * u); g.globalAlpha = 1;
  const end = clamp((t - 5.6) / 0.6);
  g.font = `900 ${60 * u}px ${FONT}`; g.globalAlpha = 0.35 + 0.65 * end;
  g.fillText(`${CARD.from} → ${CARD.to}`, 56 * u, yb + ph + 96 * u);
  g.globalAlpha = 1;
  label(g, CARD.dday, 56 * u, yb + ph + 130 * u, { size: 34 * u, bg: '#5b5ce2' });
  signature(g, u);
}

function frameWipe(g, a, b, t) {
  const u = W / 1080;
  // 0–3.2 s Take 1, 3.2–3.9 the wipe, then the latest take; the last second holds the line.
  const p = ease(clamp((t - 3.2) / 0.7));
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const draw = (img) => { g.save(); g.filter = 'blur(28px) brightness(0.5)'; fit(g, img, 0, 0, W, H, 'cover'); g.restore(); fit(g, img, 0, H * 0.28, W, H * 0.44, 'contain'); };
  if (p < 1) draw(a);
  if (p > 0) { g.save(); g.beginPath(); g.rect(0, 0, W * p, H); g.clip(); draw(b); g.restore(); g.fillStyle = '#fff'; g.fillRect(W * p - 4 * u, 0, 8 * u, H); }
  g.fillStyle = '#fff'; g.textBaseline = 'alphabetic';
  g.font = `900 ${84 * u}px ${FONT}`; g.fillText(CARD.crew, 56 * u, 330 * u);
  g.globalAlpha = 0.72; g.font = `600 ${40 * u}px ${FONT}`; g.fillText(CARD.title, 58 * u, 392 * u); g.globalAlpha = 1;
  const tag = p < 0.5 ? CARD.from : CARD.to;
  label(g, tag, 56 * u, H * 0.72 + 32 * u, { size: 56 * u, bg: p < 0.5 ? 'rgba(0,0,0,0.6)' : '#fff', fg: p < 0.5 ? '#fff' : '#000' });
  const end = clamp((t - 5.8) / 0.5);
  if (end > 0) { g.globalAlpha = end; label(g, CARD.dday, 56 * u, H - 380 * u, { size: 36 * u, bg: '#5b5ce2' }); g.globalAlpha = 1; }
  signature(g, u);
}

function signature(g, u) {
  g.globalAlpha = 0.85; g.fillStyle = '#fff'; g.textBaseline = 'alphabetic'; g.textAlign = 'right';
  g.font = `800 ${34 * u}px ${FONT}`; g.fillText('dancerly', W - 56 * u, H - 290 * u);
  g.textAlign = 'left'; g.globalAlpha = 1;
}

// ---------- Making the video ----------
async function make(kind) {
  $$('button').forEach((b) => (b.disabled = true));
  $('[data-out]').hidden = true;
  const started = performance.now();
  try {
    const codec = qs.get('codec') || ((await mb.canEncodeVideo('avc', { width: W, height: H, bitrate: 6e6 })) ? 'avc' : 'vp9');
    log(`— ${kind} · ${W}×${H} · ${codec}`);
    const open = async (url) => {
      const input = new mb.Input({ source: new mb.UrlSource(url), formats: mb.ALL_FORMATS });
      const track = await input.getPrimaryVideoTrack();
      const dur = await input.computeDuration();
      const scale = Math.min(1, (kind === 'split' ? W : H * 0.6) / Math.max(track.displayWidth, track.displayHeight));
      const sink = new mb.CanvasSink(track, { width: Math.round(track.displayWidth * scale), height: Math.round(track.displayHeight * scale), fit: 'fill', poolSize: 2 });
      return { sink, dur };
    };
    const [A, B] = await Promise.all(SRC.map(open));
    const n = FPS * LEN;
    const at = (dur, i) => Math.min(dur - 0.05, T0 + i / FPS); // both takes move on the same beat
    const range = kind === 'wipe' ? [[0, Math.ceil(3.9 * FPS)], [Math.floor(3.2 * FPS), n]] : [[0, n], [0, n]];
    const ts = (src, [s, e]) => Array.from({ length: e - s }, (_, k) => at(src.dur, s + k));
    const itA = A.sink.canvasesAtTimestamps(ts(A, range[0]))[Symbol.asyncIterator]();
    const itB = B.sink.canvasesAtTimestamps(ts(B, range[1]))[Symbol.asyncIterator]();
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const g = canvas.getContext('2d');
    const output = new mb.Output({ format: new mb.Mp4OutputFormat({ fastStart: 'in-memory' }), target: new mb.BufferTarget() });
    const source = new mb.CanvasSource(canvas, { codec, bitrate: mb.QUALITY_HIGH, keyFrameInterval: 1 });
    output.addVideoTrack(source, { frameRate: FPS });
    await output.start();
    let a = null, b = null;
    let decode = 0, draw = 0, encode = 0;
    for (let i = 0; i < n; i++) {
      let t1 = performance.now();
      if (i >= range[0][0] && i < range[0][1]) a = (await itA.next()).value?.canvas || a;
      if (i >= range[1][0] && i < range[1][1]) b = (await itB.next()).value?.canvas || b;
      let t2 = performance.now(); decode += t2 - t1;
      (kind === 'wipe' ? frameWipe : frameSplit)(g, a, b, i / FPS);
      let t3 = performance.now(); draw += t3 - t2;
      await source.add(i / FPS, 1 / FPS);
      encode += performance.now() - t3;
      if (i % 30 === 0) log(`frame ${i}/${n}`);
    }
    source.close();
    await output.finalize();
    const blob = new Blob([output.target.buffer], { type: 'video/mp4' });
    const secs = (performance.now() - started) / 1000;
    log(`done in ${secs.toFixed(1)} s · ${(blob.size / 1048576).toFixed(1)} MB · decode ${(decode / 1000).toFixed(1)} s, draw ${(draw / 1000).toFixed(1)} s, encode ${(encode / 1000).toFixed(1)} s`);
    result = { blob, kind };
    window.__card = { ok: true, secs, size: blob.size, codec };
    const v = $('[data-out]');
    v.src = URL.createObjectURL(blob); v.hidden = false; v.play().catch(() => {});
  } catch (e) {
    log(`failed: ${e?.message || e}`);
    window.__card = { ok: false, error: String(e?.message || e) };
  }
  $$('button').forEach((b) => (b.disabled = false));
  $('[data-share]').disabled = $('[data-save]').disabled = !result;
}
const $$ = (s) => [...document.querySelectorAll(s)];
$$('[data-make]').forEach((b) => b.addEventListener('click', () => make(b.dataset.make)));
$('[data-save]').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(result.blob); a.download = `dancerly-${result.kind}.mp4`; a.click();
});
$('[data-share]').addEventListener('click', async () => {
  const file = new File([result.blob], `dancerly-${result.kind}.mp4`, { type: 'video/mp4' });
  try { await navigator.share({ files: [file] }); log('shared'); } catch (e) { log(`share: ${e?.name || e}`); }
});
caps().then(() => { window.__caps = true; });
</script>
</body>
</html>
