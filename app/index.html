<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="robots" content="noindex" />
    <title>Looproom</title>
    <link rel="icon" href="/logo.svg" />
    <link rel="stylesheet" href="/app/app.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/app" data-link aria-label="Looproom projects"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>looproom</span></a>
      <a class="back-link" href="/app" data-link data-back hidden></a>
      <nav class="crumbs" data-crumbs aria-label="Breadcrumb"></nav>
      <div class="account" data-account hidden>
        <button class="avatar-btn" data-account-toggle aria-haspopup="menu" aria-label="Account"><span class="avatar" data-account-initials></span></button>
        <div class="account-menu" data-account-menu role="menu" hidden>
          <div class="account-who"><b data-account-name></b><small data-account-email></small></div>
          <button role="menuitem" data-rename>Change your name</button>
          <button role="menuitem" data-password>Change password</button>
          <button role="menuitem" data-signout>Log out</button>
        </div>
      </div>
    </header>
    <main data-view aria-live="polite"><div class="loading">Loading…</div></main>
    <div class="upload-bar" data-upload-bar role="status"><i></i><span></span><small>You can keep working while this uploads.</small></div>
    <div class="toast" data-toast role="status"></div>
    <script type="module" src="/app/main.js"></script>
  </body>
</html>
