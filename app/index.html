    <!-- Visit statistics: Vercel Web Analytics (no cookies). App addresses are reduced to their shape first:
         project, video, and request ids, invite codes, and private guest-link tokens never leave the browser. -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      window.va('beforeSend', (event) => {
        const url = new URL(event.url);
        url.pathname = url.pathname
          .replace(/^\/app\/s\/[^/]+/, '/app/s/:token')
          .replace(/^\/app\/join\/[^/]+/, '/app/join/:code')
          .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi, ':id');
        const ref = url.searchParams.get('ref');
        url.search = ref ? `?ref=${encodeURIComponent(ref)}` : '';
        url.hash = '';
        return { ...event, url: url.toString() };
      });
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
