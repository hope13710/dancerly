<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="robots" content="noindex" />
    <title>Looproom</title>
    <link rel="icon" href="/logo.svg" />
    <link rel="stylesheet" href="/app/app.css" />
  </head>
  <body>
    <aside class="sidebar" data-sidebar hidden aria-label="Main">
      <div class="side-top">
        <a class="brand" href="/app" data-link aria-label="Looproom home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>looproom</span></a>
        <button class="icon-btn" data-side-toggle aria-label="Hide sidebar" title="Hide sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9 4.5v15"/></svg></button>
      </div>
      <button class="btn primary side-new" data-new><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
      <nav class="side-nav">
        <a href="/app" data-link data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg><span>All projects</span></a>
      </nav>
      <p class="side-label">Projects</p>
      <nav class="side-projects" data-side-projects aria-label="Your projects"></nav>
      <div class="account side-account" data-account>
        <button class="account-btn" data-account-toggle aria-haspopup="menu"><span class="avatar" data-account-initials></span><span class="account-btn-copy"><b data-account-name></b><small data-account-email></small></span></button>
        <div class="account-menu" data-account-menu role="menu" hidden>
          <button role="menuitem" data-rename>Change your name</button>
          <button role="menuitem" data-password>Change password</button>
          <button role="menuitem" data-signout>Log out</button>
        </div>
      </div>
    </aside>
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn side-open" data-side-toggle aria-label="Show sidebar" title="Show sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9 4.5v15"/></svg></button>
        <a class="brand" href="/app" data-link aria-label="Looproom home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>looproom</span></a>
        <a class="back-link" href="/app" data-link data-back hidden></a>
        <nav class="crumbs" data-crumbs aria-label="Breadcrumb"></nav>
      </header>
      <main data-view aria-live="polite"><div class="loading">Loading…</div></main>
    </div>
    <nav class="tabbar" data-tabbar hidden aria-label="Main">
      <a href="/app" data-link data-nav="projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg><span>Projects</span></a>
      <button class="tab-new" data-new aria-label="New"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <a href="/app/me" data-link data-nav="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg><span>Me</span></a>
    </nav>
    <div class="upload-bar" data-upload-bar role="status"><i></i><span></span><small>You can keep working while this uploads.</small></div>
    <div class="toast" data-toast role="status"></div>
    <script type="module" src="/app/main.js"></script>
  </body>
</html>
